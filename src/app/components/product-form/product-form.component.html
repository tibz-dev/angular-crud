<!-- ============================================================
  PRIMENG FORM CONTROLS:
    pInputText    — styled text input directive
    p-inputnumber — number input with formatting
    p-button      — styled submit/cancel buttons
  All wired to Angular Reactive Forms (formControlName)
============================================================ -->

<form [formGroup]="form" (ngSubmit)="onSubmit()">

  <!-- NAME -->
  <div class="field mb-4">
    <label for="name">Name</label>
    <input
      id="name"
      type="text"
      pInputText
      formControlName="name"
      placeholder="Product name"
      class="w-full" />
    <small class="p-error"
      *ngIf="form.get('name')?.invalid && form.get('name')?.touched">
      Name is required.
    </small>
  </div>

  <!-- PRICE -->
  <div class="field mb-4">
    <label for="price">Price (R)</label>
    <p-inputnumber
      id="price"
      formControlName="price"
      mode="currency"
      currency="ZAR"
      locale="en-ZA"
      [min]="0"
      styleClass="w-full">
    </p-inputnumber>
    <small class="p-error"
      *ngIf="form.get('price')?.invalid && form.get('price')?.touched">
      Enter a valid price.
    </small>
  </div>

  <!-- CATEGORY -->
  <div class="field mb-4">
    <label for="category">Category</label>
    <input
      id="category"
      type="text"
      pInputText
      formControlName="category"
      placeholder="e.g. Electronics"
      class="w-full" />
    <small class="p-error"
      *ngIf="form.get('category')?.invalid && form.get('category')?.touched">
      Category is required.
    </small>
  </div>

  <!-- ACTIONS -->
  <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:1rem">
    <p-button
      label="Cancel"
      icon="pi pi-times"
      styleClass="p-button-text"
      type="button"
      (onClick)="onCancel()">
    </p-button>
    <p-button
      label="Save"
      icon="pi pi-check"
      type="submit"
      [disabled]="form.invalid">
    </p-button>
  </div>

</form>
